[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kernel-lab"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "triton>=2.3",
    "pytest",
    "tilelang>=0.1",
]

[tool.setuptools.packages.find]
include = ["kernel_lab*"]
