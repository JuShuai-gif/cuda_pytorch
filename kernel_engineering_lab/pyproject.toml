[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kernel-engineering-lab"
version = "0.1.0"
description = "GPU Kernel Engineering Lab: CUDA and Triton kernel development, benchmarking, and optimization"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Kernel Engineering Lab" },
]
keywords = ["cuda", "triton", "gpu", "kernel", "benchmark", "deep-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-benchmark>=4.0.0",
]
triton = [
    "triton>=2.1.0",
]
all = [
    "torch>=2.1.0",
    "numpy>=1.24.0",
    "tabulate>=0.9.0",
    "pytest>=7.0.0",
    "pytest-benchmark>=4.0.0",
    "triton>=2.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["benchmarks*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["."]
addopts = "-v --tb=short --color=yes"
markers = [
    "cuda: tests that require a CUDA-capable GPU",
    "slow: tests that take a long time to run",
    "bench: benchmark tests",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
